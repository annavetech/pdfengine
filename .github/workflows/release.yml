name: Release

# Releases on a v* tag push. The test job runs the full CI first; goreleaser runs only if it passes.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  goreleaser:
    needs: test
    runs-on: ubuntu-latest

    # The default token is read-only; contents:write is needed so creating
    # the release doesn't 403. Pushing the cask uses HOMEBREW_TAP_TOKEN instead.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Uses "stable" rather than go.mod's 1.26 floor so release binaries build
      # with current Go security fixes; ci.yml verifies the 1.26 floor separately.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.18.3"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must exist in this repo's secrets with write access to
          # annavetech/homebrew-tap, for pushing the updated cask.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
